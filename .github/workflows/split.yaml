name: Split

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - directory: php/xstache
            repository_name: xstache-php
          - directory: php/xstache-laravel
            repository_name: xstache-laravel
    steps:
      - uses: actions/checkout@v4
      - uses: danharrin/monorepo-split-github-action@v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: ${{ matrix.package.directory }}
          repository_organization: dirk
          repository_name: ${{ matrix.package.repository_name }}
          user_name: github-actions[bot]
          user_email: dirk@esherido.com
          tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
