name: "PR & Push"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: "javascript/pnpm-lock.yaml"
      # Install and build only the core packages first.
      - run: "pnpm install --filter \"@xstache/*\" --filter \"!@xstache/integration\""
      - run: "pnpm --recursive --filter \"@xstache/*\" run build"
      # Run installation again now that necessary `dist` JavaScript CLI files (which peer packages
      # in the workspace depend upon) have been built.
      - run: "pnpm install"
      - run: "pnpm run build"
      - run: "pnpm test --coverage"
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "php/${{ matrix.package }}"
    strategy:
      matrix:
        package:
          - xstache
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - uses: ramsey/composer-install@v3
        with:
          working-directory: "php/${{ matrix.package }}"
      - run: "./vendor/bin/phpunit --coverage-filter src --coverage-clover coverage.xml tests"
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
